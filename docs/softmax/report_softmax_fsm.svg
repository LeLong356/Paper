<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080"><rect x="0" y="0" width="900" height="1080" rx="0" fill="#ffffff" stroke="#ffffff" /><text x="40" y="55" font-size="32" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#172d40">Softmax top-level state machine</text><text x="40" y="90" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">Asserting asynchronous reset (rst_n = 0) returns the FSM to IDLE.</text><rect x="230" y="125" width="440" height="73" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="246" y="154" font-size="21" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#172d40">IDLE</text><text x="246" y="180" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">Wait for start while the front end is ready.</text><polyline points="450,198 450,263" fill="none" stroke="#355974" stroke-width="2" /><polygon points="450.00,263.00 454.44,254.04 445.56,254.04" fill="#355974" /><text x="464" y="235" font-size="15" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">start &amp;&amp; ready &amp;&amp; 1 ≤ row_length ≤ S</text><rect x="230" y="263" width="440" height="73" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="246" y="292" font-size="21" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#172d40">WAIT_SUM</text><text x="246" y="318" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">On sum_valid, capture sum_fp32 in sum_reg.</text><polyline points="450,336 450,401" fill="none" stroke="#355974" stroke-width="2" /><polygon points="450.00,401.00 454.44,392.04 445.56,392.04" fill="#355974" /><text x="464" y="373" font-size="15" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">sum_valid</text><rect x="230" y="401" width="440" height="73" rx="9" fill="#e7f5f0" stroke="#096762" /><text x="246" y="430" font-size="21" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#172d40">READ_NUMERATOR</text><text x="246" y="456" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">Read exp_buffer[div_index] on the next rising edge.</text><polyline points="450,474 450,539" fill="none" stroke="#355974" stroke-width="2" /><polygon points="450.00,539.00 454.44,530.04 445.56,530.04" fill="#355974" /><text x="464" y="511" font-size="15" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">Next rising edge</text><rect x="230" y="539" width="440" height="73" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="246" y="568" font-size="21" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#172d40">DIV_REQUEST</text><text x="246" y="594" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">Hold div_in_valid high until the divider accepts.</text><polyline points="450,612 450,677" fill="none" stroke="#355974" stroke-width="2" /><polygon points="450.00,677.00 454.44,668.04 445.56,668.04" fill="#355974" /><text x="464" y="649" font-size="15" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">div_in_ready</text><rect x="230" y="677" width="440" height="73" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="246" y="706" font-size="21" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#172d40">DIV_WAIT</text><text x="246" y="732" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">Capture the FP32 result, valid and last tag.</text><polyline points="450,750 450,815" fill="none" stroke="#355974" stroke-width="2" /><polygon points="450.00,815.00 454.44,806.04 445.56,806.04" fill="#355974" /><text x="464" y="787" font-size="15" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">div_out_valid &amp;&amp; final element</text><rect x="230" y="815" width="440" height="73" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="246" y="844" font-size="21" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#172d40">QUANTIZE_WAIT</text><text x="246" y="870" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">Wait for the last tag in the three-stage quantizer.</text><polyline points="450,888 450,953" fill="none" stroke="#355974" stroke-width="2" /><polygon points="450.00,953.00 454.44,944.04 445.56,944.04" fill="#355974" /><text x="464" y="925" font-size="15" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">scaled_last = 1</text><rect x="230" y="953" width="440" height="73" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="246" y="982" font-size="21" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#172d40">COMPLETE</text><text x="246" y="1008" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">out_valid = out_last = done = 1; ready = 0.</text><polyline points="230,715 55,715 55,439 230,439" fill="none" stroke="#096762" stroke-width="2" /><polygon points="230.00,439.00 221.04,434.56 221.04,443.44" fill="#096762" /><text x="67" y="539" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#096762">div_out_valid = 1</text><text x="67" y="562" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#096762">More elements</text><text x="67" y="585" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#096762">Increment div_index</text><polyline points="670,991 842,991 842,163 670,163" fill="none" stroke="#355974" stroke-width="2" /><polygon points="670.00,163.00 678.96,167.44 678.96,158.56" fill="#355974" /><text x="698" y="978" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">Return to IDLE</text><text x="40" y="1056" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">Wait states hold until their transition condition is met.</text></svg>