<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1430" viewBox="0 0 1740 1430">
  <rect width="100%" height="100%" fill="white" />
  <rect x="40" y="25" width="1660" height="100" rx="10" fill="#f5f7fa" stroke="#728092" stroke-width="2" />
  <text x="56" y="62" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Module interfaces</text>
  <text x="56" y="91" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Reference build: C = COUNT_WIDTH = 6. Each control signal is one bit.</text>
  <text x="56" y="117" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Signal notation: name[W] denotes a bus of W bits.</text>
  <rect x="40" y="155" width="530" height="280" rx="10" fill="#f1eafd" stroke="#7551a1" stroke-width="2" />
  <text x="56" y="192" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">softmax</text>
  <text x="56" y="220" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: clk, rst_n, start; row_length[C]</text>
  <text x="56" y="245" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">in_data[32] INT32; in_valid</text>
  <text x="56" y="270" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: ready; in_ready</text>
  <text x="56" y="295" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">out_data[8] signed INT8 (0…127)</text>
  <text x="56" y="320" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">out_valid; out_last; done</text>
  <text x="56" y="345" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Top FSM, front end, divider and quantizer</text>
  <rect x="600" y="155" width="530" height="280" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="616" y="192" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">softmax_exp_sum</text>
  <text x="616" y="220" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: clk, rst_n, start; row_length[C]</text>
  <text x="616" y="245" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">in_data[32] INT32; in_valid</text>
  <text x="616" y="270" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">read_index[C]</text>
  <text x="616" y="295" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: ready; in_ready; sum_valid</text>
  <text x="616" y="320" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">sum_fp32[32] FP32; read_data[16] BF16</text>
  <text x="616" y="345" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Exponential and sum wrapper</text>
  <rect x="1160" y="155" width="530" height="280" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="1176" y="192" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">softmax_exp</text>
  <text x="1176" y="220" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: clk, rst_n, start; row_length[C]</text>
  <text x="1176" y="245" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">in_data[32] INT32; in_valid</text>
  <text x="1176" y="270" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: in_ready; done; exp_valid</text>
  <text x="1176" y="295" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">max_value[32] INT32</text>
  <text x="1176" y="320" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">exp_data[16] BF16</text>
  <text x="1176" y="345" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Row maximum, conversion and exponential pipeline</text>
  <rect x="40" y="465" width="530" height="280" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="56" y="502" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">softmax_row_max</text>
  <text x="56" y="530" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: clk, rst_n, start; row_length[C]</text>
  <text x="56" y="555" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">in_data[32] INT32; in_valid</text>
  <text x="56" y="580" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: in_ready; done; diff_valid</text>
  <text x="56" y="605" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">max_value[32] INT32</text>
  <text x="56" y="630" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">diff_data[33] INT33</text>
  <text x="56" y="655" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">row_buffer[32][32]</text>
  <rect x="600" y="465" width="530" height="280" rx="10" fill="#e8f7ef" stroke="#287556" stroke-width="2" />
  <text x="616" y="502" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">int33_to_bf16</text>
  <text x="616" y="530" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: in_data[33] signed INT33</text>
  <text x="616" y="555" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: out_bf16[16] BF16</text>
  <text x="616" y="580" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">BF16: sign 1 | exponent 8 | fraction 7</text>
  <text x="616" y="605" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">RNE: nearest, ties to even</text>
  <text x="616" y="630" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Combinational datapath</text>
  <text x="616" y="655" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Valid supplied by the wrapper</text>
  <rect x="1160" y="465" width="530" height="280" rx="10" fill="#e8f7ef" stroke="#287556" stroke-width="2" />
  <text x="1176" y="502" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">vexp</text>
  <text x="1176" y="530" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: x_in[16] BF16</text>
  <text x="1176" y="555" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: exp_out[16] BF16</text>
  <text x="1176" y="580" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">exps_stage: 16-bit intermediate and three flags</text>
  <text x="1176" y="605" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">px: exps_in[7] → p_out[7]</text>
  <text x="1176" y="630" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Approximate exponential with underflow to zero</text>
  <text x="1176" y="655" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Standalone combinational VEXP</text>
  <rect x="40" y="775" width="530" height="280" rx="10" fill="#fff3db" stroke="#996825" stroke-width="2" />
  <text x="56" y="812" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">softmax_sum</text>
  <text x="56" y="840" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: clk, rst_n, start; row_length[C]</text>
  <text x="56" y="865" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">exp_data[16] BF16; exp_valid; exp_last</text>
  <text x="56" y="890" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">read_index[C]</text>
  <text x="56" y="915" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: ready; sum_valid</text>
  <text x="56" y="940" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">sum_fp32[32] FP32; read_data[16] BF16</text>
  <text x="56" y="965" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">exp_buffer[32][16] and FP32 adder</text>
  <rect x="600" y="775" width="530" height="280" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="616" y="812" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">fp32_add_positive</text>
  <text x="616" y="840" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: clk, rst_n; in_valid</text>
  <text x="616" y="865" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">a[32] FP32; b[32] FP32</text>
  <text x="616" y="890" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: in_ready; out_valid</text>
  <text x="616" y="915" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">result[32] FP32</text>
  <text x="616" y="940" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Nonnegative FP32 addition with RNE</text>
  <text x="616" y="965" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">6 stages: accept at k, output after edge k+5</text>
  <rect x="1160" y="775" width="530" height="280" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="1176" y="812" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">fp32_div_positive</text>
  <text x="1176" y="840" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: clk, rst_n; in_valid</text>
  <text x="1176" y="865" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">numerator[32] FP32</text>
  <text x="1176" y="890" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">denominator[32] FP32</text>
  <text x="1176" y="915" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: in_ready; out_valid; result[32] FP32</text>
  <text x="1176" y="940" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Iterative division: 26 quotient bits plus sticky</text>
  <text x="1176" y="965" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Normal result 31 cycles after acceptance</text>
  <rect x="40" y="1085" width="530" height="280" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="56" y="1122" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">fp32_to_int8</text>
  <text x="56" y="1150" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: clk, rst_n; in_valid</text>
  <text x="56" y="1175" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">in_data[32] FP32</text>
  <text x="56" y="1200" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: out_data[8] signed INT8; out_valid</text>
  <text x="56" y="1225" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">FP32_RNE(p×127) → integer_RNE</text>
  <text x="56" y="1250" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Clamp to [0, 127] in a three-stage pipeline</text>
  <text x="56" y="1275" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Accept one input per valid cycle</text>
  <rect x="600" y="1085" width="530" height="280" rx="10" fill="#f1eafd" stroke="#7551a1" stroke-width="2" />
  <text x="616" y="1122" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Completion signals</text>
  <text x="616" y="1150" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">softmax_exp.done marks the last exponential</text>
  <text x="616" y="1175" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Drives softmax_sum.exp_last</text>
  <text x="616" y="1200" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">softmax_sum.sum_valid marks the final FP32 sum</text>
  <text x="616" y="1225" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">out_valid and out_last mark the final INT8</text>
  <text x="616" y="1250" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">softmax.done = out_valid &amp;&amp; out_last</text>
  <text x="616" y="1275" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">done pulses once per completed output row</text>
  <rect x="1160" y="1085" width="530" height="280" rx="10" fill="#f5f7fa" stroke="#728092" stroke-width="2" />
  <text x="1176" y="1122" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Numeric formats and memory</text>
  <text x="1176" y="1150" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Scores: signed INT32. Differences: signed INT33.</text>
  <text x="1176" y="1175" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">BF16: 16 bit; FP32: 32 bit</text>
  <text x="1176" y="1200" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">BF16→FP32: {value,16'b0}, chính xác</text>
  <text x="1176" y="1225" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">read_index: C bits, synchronous read</text>
  <text x="1176" y="1250" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Hold the row in exp_buffer until division completes</text>
  <text x="1176" y="1275" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">See the utilization report for physical BRAM usage</text>
</svg>