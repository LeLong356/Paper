<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1230" viewBox="0 0 1740 1230">
  <rect width="100%" height="100%" fill="white" />
  <polyline points="1260,260 1260,300" fill="none" stroke="#7551a1" stroke-width="2" />
  <polygon points="1260,300 1265.0,288.0 1255.0,288.0" fill="#7551a1" />
  <polyline points="1260,382 1260,421" fill="none" stroke="#7551a1" stroke-width="2" />
  <polygon points="1260,421 1265.0,409.0 1255.0,409.0" fill="#7551a1" />
  <polyline points="1260,504 1260,541" fill="none" stroke="#7551a1" stroke-width="2" />
  <polygon points="1260,541 1265.0,529.0 1255.0,529.0" fill="#7551a1" />
  <polyline points="1260,624 1260,678" fill="none" stroke="#7551a1" stroke-width="2" />
  <polygon points="1260,678 1265.0,666.0 1255.0,666.0" fill="#7551a1" />
  <polyline points="1260,788 1260,830" fill="none" stroke="#7551a1" stroke-width="2" />
  <polygon points="1260,830 1265.0,818.0 1255.0,818.0" fill="#7551a1" />
  <polyline points="1260,930 1260,1000" fill="none" stroke="#7551a1" stroke-width="2" />
  <polygon points="1260,1000 1265.0,988.0 1255.0,988.0" fill="#7551a1" />
  <polyline points="1000,735 900,735 900,462 1000,462" fill="none" stroke="#7551a1" stroke-width="2" />
  <polygon points="1000,462 988.0,457.0 988.0,467.0" fill="#7551a1" />
  <polyline points="1520,1050 1650,1050 1650,215 1520,215" fill="none" stroke="#7551a1" stroke-width="2" />
  <polygon points="1520,215 1532.0,220.0 1532.0,210.0" fill="#7551a1" />
  <rect x="40" y="25" width="1660" height="100" rx="10" fill="#f5f7fa" stroke="#728092" stroke-width="2" />
  <text x="56" y="62" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Module hierarchy and top-level FSM</text>
  <text x="56" y="91" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">One active row at a time. Input scale = 1.</text>
  <text x="56" y="117" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">State transitions below describe the top-level softmax controller.</text>
  <rect x="40" y="160" width="760" height="510" rx="10" fill="#f5f7fa" stroke="#728092" stroke-width="2" />
  <text x="56" y="197" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Instance hierarchy</text>
  <text x="56" y="231" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">softmax.sv</text>
  <text x="56" y="262" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">  u_front : softmax_exp_sum</text>
  <text x="56" y="293" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">    u_exp : softmax_exp</text>
  <text x="56" y="324" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">      u_row : softmax_row_max</text>
  <text x="56" y="355" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">      u_convert : int33_to_bf16</text>
  <text x="56" y="386" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">      u_exps : exps_stage</text>
  <text x="56" y="417" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">      u_finish : vexp_finish → u_px : px</text>
  <text x="56" y="448" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">    u_sum : softmax_sum</text>
  <text x="56" y="479" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">      u_add : fp32_add_positive</text>
  <text x="56" y="510" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">  u_div : fp32_div_positive</text>
  <text x="56" y="541" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">  u_quantize : fp32_to_int8</text>
  <text x="56" y="572" fill="#172c42" font-family="Arial, sans-serif" font-size="23" font-weight="normal">The top holds sum_reg and probability_fp32.</text>
  <rect x="40" y="720" width="760" height="430" rx="10" fill="#e5f3f8" stroke="#24677b" stroke-width="2" />
  <text x="56" y="757" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Row protocol</text>
  <text x="56" y="788" fill="#172c42" font-family="Arial, sans-serif" font-size="20" font-weight="normal">1. When ready is high, present start and a valid row_length.</text>
  <text x="56" y="816" fill="#172c42" font-family="Arial, sans-serif" font-size="20" font-weight="normal">2. Transfer one INT32 on each edge with in_valid and in_ready.</text>
  <text x="56" y="844" fill="#172c42" font-family="Arial, sans-serif" font-size="20" font-weight="normal">3. Subtract max, compute exponentials, sum and divide.</text>
  <text x="56" y="872" fill="#172c42" font-family="Arial, sans-serif" font-size="20" font-weight="normal">4. Each out_valid carries one INT8 in input order.</text>
  <text x="56" y="900" fill="#172c42" font-family="Arial, sans-serif" font-size="20" font-weight="normal">5. Final result: out_valid = out_last = done = 1.</text>
  <text x="56" y="928" fill="#172c42" font-family="Arial, sans-serif" font-size="20" font-weight="normal">6. ready returns high for the next row.</text>
  <text x="56" y="956" fill="#172c42" font-family="Arial, sans-serif" font-size="20" font-weight="normal" />
  <text x="56" y="984" fill="#172c42" font-family="Arial, sans-serif" font-size="20" font-weight="normal">The receiver must accept every valid output.</text>
  <text x="56" y="1012" fill="#172c42" font-family="Arial, sans-serif" font-size="20" font-weight="normal">Setting rst_n low aborts the active row.</text>
  <text x="56" y="1040" fill="#172c42" font-family="Arial, sans-serif" font-size="20" font-weight="normal">S = 32: routed WNS = −0.061 ns at 5 ns.</text>
  <rect x="1000" y="170" width="520" height="90" rx="10" fill="#f1eafd" stroke="#7551a1" stroke-width="2" />
  <text x="1016" y="207" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">IDLE</text>
  <text x="1016" y="235" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Accept a valid start when the front end is ready.</text>
  <rect x="1000" y="300" width="520" height="82" rx="10" fill="#f1eafd" stroke="#7551a1" stroke-width="2" />
  <text x="1016" y="337" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">WAIT_SUM</text>
  <text x="1016" y="366" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">On sum_valid, capture sum_fp32 in sum_reg.</text>
  <rect x="1000" y="421" width="520" height="83" rx="10" fill="#f1eafd" stroke="#7551a1" stroke-width="2" />
  <text x="1016" y="458" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">READ_NUMERATOR</text>
  <text x="1016" y="487" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Read the numerator at div_index synchronously.</text>
  <rect x="1000" y="541" width="520" height="83" rx="10" fill="#f1eafd" stroke="#7551a1" stroke-width="2" />
  <text x="1016" y="578" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">DIV_REQUEST</text>
  <text x="1016" y="607" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Assert div_in_valid until div_in_ready.</text>
  <rect x="1000" y="678" width="520" height="110" rx="10" fill="#f1eafd" stroke="#7551a1" stroke-width="2" />
  <text x="1016" y="715" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">DIV_WAIT</text>
  <text x="1016" y="743" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">On div_out_valid, capture the quotient and last tag.</text>
  <text x="1016" y="768" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">More elements: increment div_index and read again.</text>
  <rect x="1000" y="830" width="520" height="100" rx="10" fill="#f1eafd" stroke="#7551a1" stroke-width="2" />
  <text x="1016" y="867" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">QUANTIZE_WAIT</text>
  <text x="1016" y="896" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Wait for scaled_last = 1 in the INT8 pipeline.</text>
  <rect x="1000" y="1000" width="520" height="110" rx="10" fill="#f1eafd" stroke="#7551a1" stroke-width="2" />
  <text x="1016" y="1037" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">COMPLETE</text>
  <text x="1016" y="1066" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Final INT8 valid: out_last = done = 1.</text>
  <text x="1016" y="1092" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Keep ready low. Return to IDLE on the next edge.</text>
  <rect x="1280" y="285" width="80.0" height="24" fill="white" />
  <text x="1284" y="301" fill="#344a60" font-family="Arial, sans-serif" font-size="16">valid start</text>
  <rect x="1280" y="390" width="85.0" height="24" fill="white" />
  <text x="1284" y="406" fill="#344a60" font-family="Arial, sans-serif" font-size="16">sum_valid</text>
  <rect x="1280" y="640" width="104.0" height="24" fill="white" />
  <text x="1284" y="656" fill="#344a60" font-family="Arial, sans-serif" font-size="16">div_in_ready</text>
  <rect x="1280" y="795" width="233.0" height="24" fill="white" />
  <text x="1284" y="811" fill="#344a60" font-family="Arial, sans-serif" font-size="16">div_out_valid and final element</text>
  <rect x="815" y="600" width="48.0" height="24" fill="white" />
  <text x="819" y="616" fill="#344a60" font-family="Arial, sans-serif" font-size="16">more</text>
  <rect x="1550" y="600" width="65.0" height="24" fill="white" />
  <text x="1554" y="616" fill="#344a60" font-family="Arial, sans-serif" font-size="16">to IDLE</text>
</svg>