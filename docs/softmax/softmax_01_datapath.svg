<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1370" viewBox="0 0 1740 1370">
  <rect width="100%" height="100%" fill="white" />
  <polyline points="340,280 450,280" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="450,280 438.0,275.0 438.0,285.0" fill="#344a60" />
  <polyline points="750,280 860,280" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="860,280 848.0,275.0 848.0,285.0" fill="#344a60" />
  <polyline points="1160,280 1270,280" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="1270,280 1258.0,275.0 1258.0,285.0" fill="#344a60" />
  <polyline points="1470,390 1470,540" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="1470,540 1475.0,528.0 1465.0,528.0" fill="#344a60" />
  <polyline points="1270,610 1160,610" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="1160,610 1172.0,615.0 1172.0,605.0" fill="#344a60" />
  <polyline points="1270,850 1160,850" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="1160,850 1172.0,855.0 1172.0,845.0" fill="#344a60" />
  <polyline points="860,620 600,620 600,680" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="600,680 605.0,668.0 595.0,668.0" fill="#344a60" />
  <polyline points="860,850 750,850" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="750,850 762.0,855.0 762.0,845.0" fill="#344a60" />
  <polyline points="450,770 340,770" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="340,770 352.0,775.0 352.0,765.0" fill="#344a60" />
  <polyline points="190,910 190,1040" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="190,1040 195.0,1028.0 185.0,1028.0" fill="#344a60" />
  <polyline points="340,1135 450,1135" fill="none" stroke="#344a60" stroke-width="2" />
  <polygon points="450,1135 438.0,1130.0 438.0,1140.0" fill="#344a60" />
  <rect x="40" y="25" width="1660" height="110" rx="10" fill="#f5f7fa" stroke="#728092" stroke-width="2" />
  <text x="56" y="62" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">SOFTMAX — DATAPATH / INT32 → INT8</text>
  <text x="56" y="91" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Reference build: input scale = 1, MAX_LENGTH = 32, COUNT_WIDTH = 6</text>
  <text x="56" y="117" fill="#172c42" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Blue: clocked logic | Green: combinational logic | Yellow: storage and sum | Purple: control</text>
  <rect x="40" y="200" width="300" height="190" rx="10" fill="#e5f3f8" stroke="#24677b" stroke-width="2" />
  <text x="56" y="237" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Matrix product input</text>
  <text x="56" y="265" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">in_data[31:0] — signed INT32</text>
  <text x="56" y="290" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">in_valid[0] → / ← in_ready[0]</text>
  <text x="56" y="315" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">start[0], row_length[C−1:0]</text>
  <text x="56" y="340" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">One score per input handshake</text>
  <rect x="450" y="180" width="300" height="230" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="466" y="217" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">softmax_row_max</text>
  <text x="466" y="245" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: in_data[31:0] INT32</text>
  <text x="466" y="270" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Store row and track maximum</text>
  <text x="466" y="295" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: diff_data[32:0] INT33</text>
  <text x="466" y="320" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">diff_valid[0], done[0]</text>
  <text x="466" y="345" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">max_value[31:0] INT32</text>
  <text x="466" y="370" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Subtract max after row capture</text>
  <rect x="860" y="200" width="300" height="190" rx="10" fill="#e8f7ef" stroke="#287556" stroke-width="2" />
  <text x="876" y="237" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">int33_to_bf16</text>
  <text x="876" y="265" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: in_data[32:0] INT33</text>
  <text x="876" y="290" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Normalize and round (RNE)</text>
  <text x="876" y="315" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: out_bf16[15:0] BF16</text>
  <text x="876" y="340" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Combinational logic</text>
  <rect x="1270" y="200" width="400" height="190" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="1286" y="237" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">VEXP in softmax_exp</text>
  <text x="1286" y="265" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">bf_q → exps_stage → exps_q</text>
  <text x="1286" y="290" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">vexp_finish (px) → exp_data BF16</text>
  <text x="1286" y="315" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Two registered valid and last stages</text>
  <rect x="1270" y="540" width="400" height="350" rx="10" fill="#fff3db" stroke="#996825" stroke-width="2" />
  <text x="1286" y="577" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">softmax_sum + exp_buffer</text>
  <text x="1286" y="605" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: exp_data[15:0] BF16</text>
  <text x="1286" y="630" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">exp_valid[0], exp_last[0]</text>
  <text x="1286" y="655" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">exp_buffer: 32 × 16 bit</text>
  <text x="1286" y="680" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Accumulate after row capture</text>
  <text x="1286" y="705" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">BF16 → FP32 ({data,16'b0})</text>
  <text x="1286" y="730" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">fp32_add_positive: 6 stages</text>
  <text x="1286" y="755" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">accumulator[31:0] FP32</text>
  <text x="1286" y="780" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: sum_fp32[31:0], sum_valid[0]</text>
  <text x="1286" y="805" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">READ: read_index[C−1:0] →</text>
  <text x="1286" y="830" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">read_data[15:0] BF16 (sync read)</text>
  <rect x="860" y="540" width="300" height="170" rx="10" fill="#e8f7ef" stroke="#287556" stroke-width="2" />
  <text x="876" y="577" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Numerator expansion</text>
  <text x="876" y="605" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">read_data[15:0] BF16</text>
  <text x="876" y="630" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">→ {read_data,16'b0}</text>
  <text x="876" y="655" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">div_numerator[31:0] FP32</text>
  <text x="876" y="680" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">read_index = div_index</text>
  <rect x="860" y="790" width="300" height="150" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="876" y="827" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">sum_reg in softmax</text>
  <text x="876" y="855" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Capture when sum_valid = 1</text>
  <text x="876" y="880" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Hold the FP32 row sum</text>
  <text x="876" y="905" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Shared denominator for the row</text>
  <rect x="450" y="680" width="300" height="230" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="466" y="717" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">fp32_div_positive</text>
  <text x="466" y="745" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IN: numerator[31:0] FP32</text>
  <text x="466" y="770" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">denominator[31:0] FP32</text>
  <text x="466" y="795" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">in_valid[0] / in_ready[0]</text>
  <text x="466" y="820" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">OUT: result[31:0] FP32</text>
  <text x="466" y="845" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">out_valid[0]</text>
  <text x="466" y="870" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Iterative binary division</text>
  <rect x="40" y="680" width="300" height="230" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="56" y="717" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Probability register</text>
  <text x="56" y="745" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">In softmax.sv</text>
  <text x="56" y="770" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">probability_fp32[31:0]</text>
  <text x="56" y="795" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">probability_valid[0]</text>
  <text x="56" y="820" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">probability_last[0]</text>
  <text x="56" y="845" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">Capture the divider result</text>
  <rect x="40" y="1040" width="300" height="220" rx="10" fill="#eaf2ff" stroke="#315d98" stroke-width="2" />
  <text x="56" y="1077" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">fp32_to_int8</text>
  <text x="56" y="1104" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">IN: in_data[31:0] FP32</text>
  <text x="56" y="1128" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">in_valid[0]</text>
  <text x="56" y="1152" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">×127 → RNE FP32</text>
  <text x="56" y="1176" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">→ RNE integer → clamp 0…127</text>
  <text x="56" y="1200" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">OUT: out_data[7:0] signed INT8</text>
  <text x="56" y="1224" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">out_valid[0], three-stage pipeline</text>
  <rect x="450" y="1040" width="300" height="220" rx="10" fill="#e5f3f8" stroke="#24677b" stroke-width="2" />
  <text x="466" y="1077" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">OUTPUT / softmax.sv</text>
  <text x="466" y="1104" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">out_data[7:0] — signed INT8</text>
  <text x="466" y="1128" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">Code range: 0 to 127</text>
  <text x="466" y="1152" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">out_valid: result available</text>
  <text x="466" y="1176" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">out_last: final result</text>
  <text x="466" y="1200" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">done[0] = out_valid &amp; out_last</text>
  <text x="466" y="1224" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">Capture each valid output</text>
  <rect x="860" y="1030" width="810" height="240" rx="10" fill="#f1eafd" stroke="#7551a1" stroke-width="2" />
  <text x="876" y="1067" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Top-level controller in softmax.sv</text>
  <text x="876" y="1095" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">IDLE → WAIT_SUM → READ_NUMERATOR → DIV_REQUEST → DIV_WAIT</text>
  <text x="876" y="1120" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">More elements: return to READ_NUMERATOR. Final element: QUANTIZE_WAIT → COMPLETE.</text>
  <text x="876" y="1145" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">read_index selects the numerator. sum_reg holds the denominator throughout division.</text>
  <text x="876" y="1170" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">The last tag follows the INT8 pipeline. done marks the final valid result.</text>
  <text x="876" y="1195" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">ready stays low until the row completes.</text>
  <text x="876" y="1220" fill="#172c42" font-family="Arial, sans-serif" font-size="17" font-weight="normal">S = 32: routed WNS = −0.061 ns at a 5 ns target.</text>
  <rect x="450" y="435" width="710" height="100" rx="10" fill="#f5f7fa" stroke="#728092" stroke-width="2" />
  <text x="466" y="472" fill="#172c42" font-family="Arial, sans-serif" font-size="21" font-weight="bold">Stream control</text>
  <text x="466" y="499" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">diff_valid and row_last follow the data through both VEXP stages.</text>
  <text x="466" y="523" fill="#172c42" font-family="Arial, sans-serif" font-size="16" font-weight="normal">softmax_exp.done marks the final exponential. Top-level done marks the final INT8.</text>
  <rect x="355" y="255" width="51.0" height="24" fill="white" />
  <text x="359" y="271" fill="#344a60" font-family="Arial, sans-serif" font-size="16">32 bit</text>
  <rect x="770" y="255" width="51.0" height="24" fill="white" />
  <text x="774" y="271" fill="#344a60" font-family="Arial, sans-serif" font-size="16">33 bit</text>
  <rect x="1180" y="255" width="51.0" height="24" fill="white" />
  <text x="1184" y="271" fill="#344a60" font-family="Arial, sans-serif" font-size="16">16 bit</text>
  <rect x="1490" y="445" width="160.0" height="24" fill="white" />
  <text x="1494" y="461" fill="#344a60" font-family="Arial, sans-serif" font-size="16">exp_data[15:0] BF16</text>
  <rect x="1490" y="472" width="191.0" height="24" fill="white" />
  <text x="1494" y="488" fill="#344a60" font-family="Arial, sans-serif" font-size="16">exp_valid / exp_last: 1 bit</text>
  <rect x="1175" y="585" width="51.0" height="24" fill="white" />
  <text x="1179" y="601" fill="#344a60" font-family="Arial, sans-serif" font-size="16">16 bit</text>
  <rect x="1180" y="825" width="51.0" height="24" fill="white" />
  <text x="1184" y="841" fill="#344a60" font-family="Arial, sans-serif" font-size="16">32 bit</text>
  <rect x="650" y="590" width="127.0" height="24" fill="white" />
  <text x="654" y="606" fill="#344a60" font-family="Arial, sans-serif" font-size="16">FP32 numerator</text>
  <rect x="770" y="815" width="68.0" height="24" fill="white" />
  <text x="774" y="831" fill="#344a60" font-family="Arial, sans-serif" font-size="16">Denom.</text>
  <rect x="355" y="740" width="51.0" height="24" fill="white" />
  <text x="359" y="756" fill="#344a60" font-family="Arial, sans-serif" font-size="16">32 bit</text>
  <rect x="210" y="965" width="153.0" height="24" fill="white" />
  <text x="214" y="981" fill="#344a60" font-family="Arial, sans-serif" font-size="16">FP32 / 32 bit + valid</text>
  <rect x="365" y="1105" width="42.0" height="24" fill="white" />
  <text x="369" y="1121" fill="#344a60" font-family="Arial, sans-serif" font-size="16">8 bit</text>
</svg>