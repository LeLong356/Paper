<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1116" viewBox="0 0 1080 1116"><rect x="0" y="0" width="1080" height="1116" rx="0" fill="#ffffff" stroke="#ffffff" /><text x="40" y="54" font-size="32" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#172d40">Softmax interface and datapath</text><text x="40" y="92" font-size="21" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#096762">Top-level ports</text><rect x="420" y="110" width="240" height="219" rx="9" fill="#e7f5f0" stroke="#096762" /><text x="540" y="205" font-size="28" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#172d40">softmax</text><text x="540" y="237" font-size="17" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">MAX_LENGTH = S</text><text x="540" y="265" font-size="17" font-family="Arial, sans-serif" text-anchor="middle" fill="#475e70">C = $clog2(S + 1)</text><text x="310" y="141" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="end" fill="#172d40">clk</text><polyline points="321,135 420,135" fill="none" stroke="#355974" stroke-width="2" /><polygon points="420.00,135.00 411.04,130.56 411.04,139.44" fill="#355974" /><polyline points="660,135 756,135" fill="none" stroke="#355974" stroke-width="2" /><polygon points="756.00,135.00 747.04,130.56 747.04,139.44" fill="#355974" /><text x="766" y="141" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#172d40">done</text><text x="310" y="175" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="end" fill="#172d40">rst_n</text><polyline points="321,169 420,169" fill="none" stroke="#355974" stroke-width="2" /><polygon points="420.00,169.00 411.04,164.56 411.04,173.44" fill="#355974" /><polyline points="660,169 756,169" fill="none" stroke="#355974" stroke-width="2" /><polygon points="756.00,169.00 747.04,164.56 747.04,173.44" fill="#355974" /><text x="766" y="175" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#172d40">ready</text><text x="310" y="209" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="end" fill="#172d40">start</text><polyline points="321,203 420,203" fill="none" stroke="#355974" stroke-width="2" /><polygon points="420.00,203.00 411.04,198.56 411.04,207.44" fill="#355974" /><polyline points="660,203 756,203" fill="none" stroke="#355974" stroke-width="2" /><polygon points="756.00,203.00 747.04,198.56 747.04,207.44" fill="#355974" /><text x="766" y="209" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#172d40">in_ready</text><text x="310" y="243" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="end" fill="#172d40">row_length[C-1:0]</text><polyline points="321,237 420,237" fill="none" stroke="#355974" stroke-width="2" /><polygon points="420.00,237.00 411.04,232.56 411.04,241.44" fill="#355974" /><polyline points="660,237 756,237" fill="none" stroke="#355974" stroke-width="2" /><polygon points="756.00,237.00 747.04,232.56 747.04,241.44" fill="#355974" /><text x="766" y="243" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#172d40">out_data[7:0]  INT8</text><text x="310" y="277" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="end" fill="#172d40">in_data[31:0]  INT32</text><polyline points="321,271 420,271" fill="none" stroke="#355974" stroke-width="2" /><polygon points="420.00,271.00 411.04,266.56 411.04,275.44" fill="#355974" /><polyline points="660,271 756,271" fill="none" stroke="#355974" stroke-width="2" /><polygon points="756.00,271.00 747.04,266.56 747.04,275.44" fill="#355974" /><text x="766" y="277" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#172d40">out_valid</text><text x="310" y="311" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="end" fill="#172d40">in_valid</text><polyline points="321,305 420,305" fill="none" stroke="#355974" stroke-width="2" /><polygon points="420.00,305.00 411.04,300.56 411.04,309.44" fill="#355974" /><polyline points="660,305 756,305" fill="none" stroke="#355974" stroke-width="2" /><polygon points="756.00,305.00 747.04,300.56 747.04,309.44" fill="#355974" /><text x="766" y="311" font-size="18" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#172d40">out_last</text><text x="40" y="390" font-size="21" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#096762">Single-row datapath</text><rect x="40" y="423" width="220" height="68" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="150.0" y="451" font-size="19" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#172d40">softmax_row_max</text><text x="150.0" y="474" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">Store row, subtract max</text><rect x="355" y="423" width="190" height="68" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="450.0" y="451" font-size="19" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#172d40">int33_to_bf16</text><text x="450.0" y="474" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">INT33 → BF16</text><rect x="635" y="423" width="140" height="68" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="705.0" y="451" font-size="19" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#172d40">vexp</text><text x="705.0" y="474" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">2 register stages</text><rect x="855" y="423" width="185" height="68" rx="9" fill="#e7f5f0" stroke="#096762" /><text x="947.5" y="451" font-size="19" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#172d40">softmax_sum</text><text x="947.5" y="474" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">6-stage FP32 adder</text><polyline points="260,457 355,457" fill="none" stroke="#355974" stroke-width="2" /><polygon points="355.00,457.00 346.04,452.56 346.04,461.44" fill="#355974" /><text x="307.5" y="444" font-size="15" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">INT33</text><polyline points="545,457 635,457" fill="none" stroke="#355974" stroke-width="2" /><polygon points="635.00,457.00 626.04,452.56 626.04,461.44" fill="#355974" /><text x="590.0" y="444" font-size="15" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">BF16</text><polyline points="775,457 855,457" fill="none" stroke="#355974" stroke-width="2" /><polygon points="855.00,457.00 846.04,452.56 846.04,461.44" fill="#355974" /><text x="815.0" y="444" font-size="15" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">BF16</text><text x="40" y="540" font-size="21" font-family="Arial, sans-serif" font-weight="bold" text-anchor="start" fill="#096762">Numerator read and division by the row sum</text><rect x="40" y="595" width="248" height="68" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="164.0" y="623" font-size="19" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#172d40">BF16 → FP32</text><text x="164.0" y="646" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">{read_data, 16'b0}</text><rect x="350" y="595" width="200" height="68" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="450.0" y="623" font-size="19" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#172d40">sum_reg</text><text x="450.0" y="646" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">Capture sum_fp32</text><rect x="636" y="709" width="239" height="68" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="755.5" y="737" font-size="19" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#172d40">fp32_div_positive</text><text x="755.5" y="760" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">Divide by row sum</text><polyline points="903,491 903,565 164,565 164,595" fill="none" stroke="#355974" stroke-width="2" /><polygon points="164.00,595.00 168.44,586.04 159.56,586.04" fill="#355974" /><text x="365" y="559" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">exp_buffer[div_index] · synchronous read</text><polyline points="990,491 990,584 450,584 450,595" fill="none" stroke="#355974" stroke-width="2" /><polygon points="450.00,595.00 454.44,586.04 445.56,586.04" fill="#355974" /><text x="820" y="580" font-size="15" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">sum_fp32</text><polyline points="164,663 164,720 636,720" fill="none" stroke="#355974" stroke-width="2" /><polygon points="636.00,720.00 627.04,715.56 627.04,724.44" fill="#355974" /><text x="342" y="713" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">FP32 numerator</text><polyline points="450,663 450,753 636,753" fill="none" stroke="#355974" stroke-width="2" /><polygon points="636.00,753.00 627.04,748.56 627.04,757.44" fill="#355974" /><text x="482" y="746" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="start" fill="#475e70">FP32 denominator</text><rect x="636" y="807" width="239" height="68" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="755.5" y="835" font-size="19" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#172d40">probability_fp32</text><text x="755.5" y="858" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">Registered quotient</text><polyline points="756,777 756,807" fill="none" stroke="#355974" stroke-width="2" /><polygon points="756.00,807.00 760.44,798.04 751.56,798.04" fill="#355974" /><rect x="350" y="807" width="200" height="68" rx="9" fill="#f1f6f9" stroke="#99adba" /><text x="450.0" y="835" font-size="19" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#172d40">fp32_to_int8</text><text x="450.0" y="858" font-size="16" font-family="Arial, sans-serif" font-weight="normal" text-anchor="middle" fill="#475e70">3-stage quantizer</text><polyline points="636,841 550,841" fill="none" stroke="#355974" stroke-width="2" /><polygon points="550.00,841.00 558.96,845.44 558.96,836.56" fill="#355974" /><polyline points="350,841 246,841" fill="none" stroke="#355974" stroke-width="2" /><polygon points="246.00,841.00 254.96,845.44 254.96,836.56" fill="#355974" /><text x="232" y="847" font-size="20" font-family="Arial, sans-serif" font-weight="bold" text-anchor="end" fill="#172d40">out_data[7:0]</text><text x="40" y="924" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#096762">Pipeline stages</text><text x="40" y="960" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#172d40">VEXP    diff_data → BF16 conversion → [bf_q] → exps_stage → [exps_q and flags] → vexp_finish</text><text x="40" y="989" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d40">Brackets mark registers. The valid and last tags follow the data through both stages.</text><text x="40" y="1039" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#172d40">FP32 adder    Capture operands → Compare exponents → Align → Add → Round → Pack</text><text x="40" y="1069" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d40">Operands accepted at edge k produce a result after k+5. Row accumulation issues an addition every eight cycles.</text></svg>